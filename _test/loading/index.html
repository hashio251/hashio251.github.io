<style>
  #loading {
  transition: all 2s;
  background-color: #ddd;
  position: fixed;
  z-index: 9999;
  inset: 0;
  display: grid;
  place-items: center;
}

.loading-inner {
  
}

.loading-spinner {
  width: 200px;
  height: 200px;
  animation: spin .6s linear infinite;
  background: none;
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.loading-txt {
  font-size: 2em;
  background: none;
}

.loaded {
  /* opacity: .5; */
  visibility: hidden;
}

  <body>
    <div class="loading-inner">
    <div id="loading">
      <div class="loading-img-container">
      <img class="loading-spinner" src="./loading.png" alt="" />
      <img class="loading-spinner" src="./loading2.png" alt="" />
      <img class="loading-spinner" src="./loading4.png" alt="" />
