<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <style>
    body {
      text-align: center;
    }

    h1 {
      padding: 5em;
    }

    h1#title, img {
      display: none;
    }

    div#img-container {
      padding-top: 1em;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    @media screen and (max-width: 767px) {
      body {
        scale: .5;
      }

      h1 {
        padding: 1em;
      }
    }
  </style>
  <h1 id="heading">こんにちは</h1>

  <h1 id="title">ラーメンが食べたいですか？</h1>
  <div id="img-container">
    <img src="./ramen.png" alt="ラーメンの画像" width="" height="">
    <img src="./chop-stick.png" alt="お箸の画像" width="" height="">
  </div>
  <script>
    function heading() {
      const heading = document.querySelector('#heading');

      const keyframes = {
        opacity: [0, 1],
        translate: ['0 50px', 0],
      };
      const options = {
        duration: 5000,
        easing: 'ease',
      };

      heading.animate(keyframes, options);

    }

    function title() {
      const title = document.querySelector('#title');

      const keyframes = {
        opacity: [0, 1],
        rotate: ['x 360deg', 0],
      };

      const options = {
        delay: 3000,
        duration: 5000,
        easing: 'ease',
        fill: 'backwards',
      }

      title.style.display = 'block';
      title.animate(keyframes, options);
    }

    function ramenImg() {
      const ramenImg = document.querySelectorAll('img');

      const keyframes = {
        opacity: [0, 1],
        translate: ['0 50px', 0],
      }

      const options = {
        delay: 7000,
        duration: 5000,
        easing: 'ease',
        fill: 'backwards',
      }
      ramenImg.forEach((img) => {
        img.style.display = 'block';
        img.animate(keyframes, options);
      })
    }

    heading();
    title();
    ramenImg();
  </script>

</body>

</html>
